<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f5c45">
    <title>Cadastro de Livros</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Cadastro de Livro</h1>
        <p>Gerencie os Livros cadastrados no sistema</p>
      </div>
    </header>

    <main class="container">
      <section class="painel">
        <h2 id="titulo-formulario">Novo livro</h2>

        <form id="form-livro">
          <input type="hidden" id="livro-id">

          <label for="titulo">Título do Livro</label>
          <input id="titulo" name="titulo" type="text" required>

          <label for="autor">Autor</label>
          <input id="autor" name="autor" type="text" required>

          <label for="genero">Gênero</label>
          <input id="genero" name="genero" type="text" min="0">

          <label for="anoPublicacao">Ano da Publicação</label>
          <input id="anoPublicacao" name="anoPublicacao" type="number" min="0">

          <label> <input type="checkbox" id = "disponivel" checked></label>

          

          <div class="acoes-formulario">
            <button type="submit" id="botao-salvar">Cadastrar Livro</button>
            <button type="button" id="botao-cancelar" class="secundario oculto">
              Cancelar edição
            </button>
          </div>
        </form>
      </section>

      <section class="painel">
        <div class="cabecalho-lista">
          <h2>Livros</h2>
          <button type="button" id="botao-atualizar" class="secundario">Atualizar lista</button>
        </div>

        <form id="form-busca" class="busca">
          <label for="busca-id">Buscar livro pelo ID</label>
          <div class="linha-busca">
            <input id="busca-id" type="text" placeholder="Informe o ID do Livro">
            <button type="submit">Buscar</button>
            <button type="button" id="botao-limpar-busca" class="secundario">Listar todos os Livros</button>
          </div>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>
        <div id="lista-livros" class="lista-livros"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
